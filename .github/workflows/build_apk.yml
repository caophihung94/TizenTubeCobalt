name: Build Cobalt APK (Fixed Path)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Trống ổ cứng
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          
      # 1. Ép mã nguồn tải vào thư mục 'src' 
      - name: Clone Code
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Sync & Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PATH:$PWD/depot_tools
          
          # 2. Tạo file cấu hình giả lập chuẩn Chromium
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          target_os = ['android']
          EOF
          
          gclient sync --no-history
          
          # 3. Chuyển vào 'src' để build
          cd src
          python3 cobalt/build/gn.py -p android-arm -c qa --use-sccache
          ninja -C out/android-arm_qa cobalt_apk

      - name: Trả file
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: src/out/android-arm_qa/**/*.apk
