name: Build Cobalt APK (Bulletproof)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Trống ổ cứng
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          
      - name: Clone Code (Full History)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0  # <--- Fix dứt điểm lỗi "git log" báo 0.0.0

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.6

      - name: Sync & Build
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PATH:$PWD/depot_tools
          
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          target_os = ['android']
          EOF
          
          gclient sync --no-history
          
          # Tạo Debug Keystore ảo (Máy chủ Github không có sẵn)
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"
          
          cd src
          python3 cobalt/build/gn.py -p android-arm -c qa --no-rbe --use-sccache
          
          # <--- Thêm -j 2 để giới hạn CPU, chống sập RAM (OOM) của máy chủ 7GB.
          ninja -C out/android-arm_qa -j 2 cobalt_apk

      - name: Trả file
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: src/out/android-arm_qa/**/*.apk
