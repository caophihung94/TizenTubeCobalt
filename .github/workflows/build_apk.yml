name: Build Cobalt APK (Bulletproof)
on: [workflow_dispatch]

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340 
    
    steps:
      - name: Trống ổ cứng
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
          
      - name: Clone Code (Full History)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Cài đặt System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gperf bison flex python3-setuptools gcc-multilib g++-multilib libc6:i386 libstdc++6:i386 libgcc-s1:i386 ccache

      - name: Phục hồi Compiler Cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cobalt-${{ github.run_id }}
          restore-keys: |
            ccache-cobalt-

      - name: Sync & Build
        run: |
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PATH:$PWD/depot_tools
          
          export CCACHE_DIR=~/.cache/ccache
          export CCACHE_MAXSIZE=10G
          ccache -M 10G
          
          git config --global core.askPass /bin/echo
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          target_os = ['android']
          EOF
          
          gclient sync -v -v -j 4 --no-history
          
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

          mkdir -p ../.android ../../.android ../../../.android
          cp ~/.android/debug.keystore ../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../../.android/ 2>/dev/null || true
          
          cd src
          python3 cobalt/build/gn.py -p android-arm -c qa --no-rbe
          
          echo 'cc_wrapper="ccache"' >> out/android-arm_qa/args.gn
          gn gen out/android-arm_qa
          
          # ---> CẬP NHẬT: Chủ động dừng biên dịch sau 4.5 tiếng để bảo toàn mảng lưu Cache <---
          timeout 4.5h ninja -C out/android-arm_qa -j 1 cobalt_apk

      - name: Trả file
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: src/out/android-arm_qa/**/*.apk

      # ---> BƯỚC MỚI: Bóp chết hoàn toàn mọi tiến trình ngầm <---
      - name: Dọn dẹp tiến trình ngầm (Chống lỗi đóng gói Cache)
        if: always()
        run: |
          echo "Đang dọn dẹp các luồng biên dịch còn sót lại..."
          killall -9 ninja clang clang++ python3 2>/dev/null || true
          sleep 5 # Cho ổ cứng 5 giây nghỉ ngơi để chốt dữ liệu

      - name: Lưu Compiler Cache (Luôn chạy)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ccache-cobalt-${{ github.run_id }}

      - name: Tự động Resume nếu Timeout
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Thời gian tiến trình đã chạy: $DURATION giây"
          
          if [ $DURATION -gt 14400 ]; then
            echo "Phát hiện Timeout hệ thống an toàn! Đang tự động kích hoạt lượt chạy nối tiếp..."
            
            # ---> CẬP NHẬT: Thêm tham số --repo "${{ github.repository }}" <---
            gh workflow run "${{ github.workflow }}" --ref "${{ github.ref }}" --repo "${{ github.repository }}"
            
          else
            echo "Lỗi xuất hiện sớm (dưới 4 tiếng). Đây là lỗi mã nguồn thật sự, KHÔNG tự động chạy lại."
          fi
