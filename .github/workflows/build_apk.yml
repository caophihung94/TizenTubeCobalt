name: Build Cobalt APK (Bulletproof)
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Trống ổ cứng
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          
      # BẮT BUỘC: Giữ Swap 10GB để không bị sập ngầm khi build
      - name: Set up Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10
          
      - name: Clone Code (Full History)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      # Cài đặt thêm ccache để làm bộ nhớ đệm
      - name: Cài đặt System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gperf bison flex python3-setuptools gcc-multilib g++-multilib libc6:i386 libstdc++6:i386 libgcc-s1:i386 ccache

      # Cơ chế khôi phục tiến trình (Nếu job bị ngắt 6h, lần sau chạy sẽ nối tiếp)
      - name: Phục hồi Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cobalt-${{ github.run_id }}
          restore-keys: |
            ccache-cobalt-
          save-always: true  # <--- BẮT BUỘC THÊM DÒNG NÀY

      - name: Sync & Build
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PATH:$PWD/depot_tools
          
          # Cấu hình Ccache
          export CCACHE_DIR=~/.cache/ccache
          export CCACHE_MAXSIZE=10G
          ccache -M 10G
          
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          target_os = ['android']
          EOF
          
          gclient sync --no-history
          
          # Tạo Debug Keystore ảo
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

          # Fix tính toán sai đường dẫn tương đối của script GN
          mkdir -p ../.android ../../.android ../../../.android
          cp ~/.android/debug.keystore ../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../../.android/ 2>/dev/null || true
          
          cd src
          python3 cobalt/build/gn.py -p android-arm -c qa --no-rbe
          
          # Ép hệ thống dùng Ccache để lưu tiến độ
          echo 'cc_wrapper="ccache"' >> out/android-arm_qa/args.gn
          gn gen out/android-arm_qa
          
          # Dùng -j 2 + Swap để chống sập RAM
          ninja -C out/android-arm_qa -j 2 cobalt_apk

      - name: Trả file
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: src/out/android-arm_qa/**/*.apk
