name: Build Cobalt APK (Bulletproof)
on: [workflow_dispatch]

# Cấp quyền cho phép Workflow tự kích hoạt lại chính nó
permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    # Chủ động ngắt ở 5h40 phút để chừa thời gian lưu Cache và gọi lệnh Restart
    timeout-minutes: 340 
    
    steps:
      - name: Trống ổ cứng
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          
      # - name: Set up Swap Space
      #   uses: pierotofy/set-swap-space@master
      #   with:
      #     swap-size-gb: 10
          
      - name: Clone Code (Full History)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Cài đặt System Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gperf bison flex python3-setuptools gcc-multilib g++-multilib libc6:i386 libstdc++6:i386 libgcc-s1:i386 ccache

      - name: Phục hồi Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-cobalt-${{ github.run_id }}
          restore-keys: |
            ccache-cobalt-
          save-always: true

      - name: Sync & Build
        run: |
          # Đánh dấu thời gian bắt đầu build
          echo "START_TIME=$(date +%s)" >> $GITHUB_ENV
          
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          export PATH=$PATH:$PWD/depot_tools
          
          export CCACHE_DIR=~/.cache/ccache
          export CCACHE_MAXSIZE=10G
          ccache -M 10G
          
          cat << 'EOF' > .gclient
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/${{ github.repository }}.git",
              "deps_file": "DEPS",
              "managed": False,
              "custom_deps": {},
            },
          ]
          target_os = ['android']
          EOF
          
          gclient sync --no-history
          
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

          mkdir -p ../.android ../../.android ../../../.android
          cp ~/.android/debug.keystore ../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../.android/ 2>/dev/null || true
          cp ~/.android/debug.keystore ../../../.android/ 2>/dev/null || true
          
          cd src
          python3 cobalt/build/gn.py -p android-arm -c qa --no-rbe
          
          echo 'cc_wrapper="ccache"' >> out/android-arm_qa/args.gn
          gn gen out/android-arm_qa
          
          ninja -C out/android-arm_qa -j 2 cobalt_apk

      - name: Trả file
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-apk
          path: src/out/android-arm_qa/**/*.apk

      # BƯỚC MỚI: Tự động chạy lại nếu bị ngắt do Timeout
      - name: Tự động Resume nếu Timeout
        if: failure() # Chỉ chạy bước này nếu bước "Sync & Build" bị lỗi hoặc timeout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tính toán xem tiến trình đã chạy được bao nhiêu giây
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "Thời gian tiến trình đã chạy: $DURATION giây"
          
          # 18000 giây = 5 tiếng. 
          # Nếu chạy hơn 5 tiếng mới lỗi, chứng tỏ là do timeout hệ thống.
          if [ $DURATION -gt 18000 ]; then
            echo "Phát hiện Timeout! Đang tự động gọi một lượt chạy mới để nối tiếp Ccache..."
            gh workflow run "${{ github.workflow }}" --ref "${{ github.ref }}"
          else
            echo "Lỗi xuất hiện sớm (dưới 5 tiếng). Đây là lỗi mã nguồn thật sự, KHÔNG tự động chạy lại để tránh lặp vô hạn."
          fi
